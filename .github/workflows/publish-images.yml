name: Publicar imagens
on:
  push: { branches: [main] }
permissions: { contents: read, packages: write }
jobs:
  publish:
    name: CD / imagens GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: docker/backend/Dockerfile, push: true, tags: 'ghcr.io/realfelipedeveloper/fcontrol-backend:latest,ghcr.io/realfelipedeveloper/fcontrol-backend:${{ github.sha }}' }
      - uses: docker/build-push-action@v6
        with: { context: ., file: docker/frontend/Dockerfile, push: true, tags: 'ghcr.io/realfelipedeveloper/fcontrol-frontend:latest,ghcr.io/realfelipedeveloper/fcontrol-frontend:${{ github.sha }}' }
