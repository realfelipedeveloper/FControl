name: E2E
on:
  pull_request: { branches: [develop, main] }
jobs:
  e2e:
    name: E2E / fluxo financeiro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build
      - run: curl --fail --retry 30 --retry-delay 5 http://localhost:8080/api/v1/health
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v5
        with: { node-version: 24.15.0, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color > docker-e2e.log
      - if: always()
        uses: actions/upload-artifact@v5
        with: { name: logs-e2e, path: docker-e2e.log, retention-days: 7 }
      - if: always()
        run: docker compose down -v
