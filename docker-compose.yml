name: fcontrol

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fcontrol}
      MYSQL_USER: ${MYSQL_USER:-fcontrol}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fcontrol-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fcontrol]

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment: &backend-env
      APP_NAME: FControl
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-base64:Q29uZmlndXJlVW1hQ2hhdmVTZWd1cmFEZVNlbmhlZGE=}
      APP_URL: http://localhost:${APP_PORT:-8080}
      FRONTEND_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-fcontrol}
      DB_USERNAME: ${MYSQL_USER:-fcontrol}
      DB_PASSWORD: ${MYSQL_PASSWORD:-fcontrol-local}
      JWT_SECRET: ${JWT_SECRET:-configure-um-segredo-jwt-com-32-caracteres-ou-mais}
      CORS_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8080},http://localhost:4200
      LOG_CHANNEL: stderr
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [fcontrol]

  scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: php artisan schedule:work
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [fcontrol]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [fcontrol]

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [fcontrol]

volumes:
  mysql_data:
  backend_storage:

networks:
  fcontrol:
    driver: bridge
